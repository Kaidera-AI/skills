name: Marketplace Refresh (Gate 4 prerequisite — unsigned)

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**/*.SKILL.md'
      - 'scripts/generate-marketplace.js'
      - 'scripts/update-hash.js'
      - '.github/workflows/skill-publish.yml'

permissions:
  contents: write
  id-token: write  # reserved for the future ratified Cosign gate

jobs:
  publish:
    name: Generate content_hash + Update marketplace.json (not Gate 4 approval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Compute content hashes for changed skills
        run: |
          git diff --name-only HEAD~1 HEAD \
            | sed -n '/^skills\/.*\.SKILL\.md$/p' \
            | while IFS= read -r f; do
                hash=$(node scripts/generate-marketplace.js --hash "$f")
                echo "Hash for $f: $hash"
                # Update content_hash field in the SKILL.md frontmatter
                node scripts/update-hash.js "$f" "$hash"
              done

      - name: Generate marketplace.json
        run: node scripts/generate-marketplace.js

      - name: Validate generated marketplace.json
        run: >-
          node -e 'const m = require("./.claude-plugin/marketplace.json");
          if (!m.skills || !Array.isArray(m.skills)) throw new Error("Invalid marketplace.json");
          console.log("marketplace.json valid —", m.skills.length, "skills");'

      - name: Commit updated files
        run: |
          git config user.name "EnGenAI CI"
          git config user.email "ci@engenai.app"
          git add .claude-plugin/marketplace.json skills/**/*.SKILL.md
          git diff --staged --quiet || git commit -m "chore(ci): update content hashes + marketplace.json [skip ci]"
          git push origin main

      # HOLD: this refresh is not human review, Cosign signing, or SLSA
      # provenance. Gate 4 remains incomplete until a separately ratified trust
      # root and required-review policy are wired. Do not treat the generated
      # hash or marketplace entry as Gate 4 acceptance.
