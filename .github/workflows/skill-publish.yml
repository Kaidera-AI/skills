name: Marketplace Integrity (Gate 4 prerequisite — unsigned)

on:
  pull_request:
    paths:
      - 'skills/**/*.SKILL.md'
      - '.claude-plugin/marketplace.json'
      - 'scripts/generate-marketplace.js'
      - 'scripts/validate-skill.js'
      - 'scripts/skill-format.js'
      - 'package.json'
      - 'package-lock.json'
      - 'spec/skill-security-patterns.json'
      - '.github/workflows/skill-publish.yml'
  push:
    branches:
      - main
    paths:
      - 'skills/**/*.SKILL.md'
      - '.claude-plugin/marketplace.json'
      - 'scripts/generate-marketplace.js'
      - 'scripts/validate-skill.js'
      - 'scripts/skill-format.js'
      - 'package.json'
      - 'package-lock.json'
      - 'spec/skill-security-patterns.json'
      - '.github/workflows/skill-publish.yml'

permissions:
  contents: read

jobs:
  integrity:
    name: Reproduce committed marketplace (not Gate 4 approval)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Generate marketplace.json
        run: node scripts/generate-marketplace.js

      - name: Validate generated marketplace.json
        run: >-
          node -e 'const m = require("./.claude-plugin/marketplace.json");
          if (!m.skills || !Array.isArray(m.skills)) throw new Error("Invalid marketplace.json");
          console.log("marketplace.json valid —", m.skills.length, "skills");'

      - name: Require reproducible committed catalogue
        run: git diff --exit-code -- .claude-plugin/marketplace.json

      # HOLD: this integrity check is not human review, Cosign signing, or SLSA
      # provenance. Gate 4 remains incomplete until a separately ratified trust
      # root and required-review policy are wired. Do not treat the generated
      # hash or marketplace entry as Gate 4 acceptance.
