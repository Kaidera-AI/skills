name: Skill Security Scan (Gate 2 subset)

on:
  pull_request:
    paths:
      - 'skills/**/*.SKILL.md'
      - 'scripts/security-scan.py'
      - 'scripts/validate-skill.js'
      - 'scripts/skill-format.js'
      - 'package.json'
      - 'package-lock.json'
      - 'spec/SKILL_FORMAT.md'
      - 'spec/skill-security-patterns.json'
      - '.github/workflows/skill-security-scan.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**/*.SKILL.md'
      - 'scripts/security-scan.py'
      - 'scripts/validate-skill.js'
      - 'scripts/skill-format.js'
      - 'spec/SKILL_FORMAT.md'
      - 'spec/skill-security-patterns.json'
      - '.github/workflows/skill-security-scan.yml'

permissions:
  contents: read

jobs:
  security-scan:
    name: Injection Pattern + Regex Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: '3.11'

      - name: Run injection pattern scan on complete catalogue
        run: find skills -name '*.SKILL.md' -print0 | sort -z | xargs -0 python scripts/security-scan.py
