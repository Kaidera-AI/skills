name: Skill Contract Lint (Gate 1 subset)

on:
  pull_request:
    paths:
      - 'skills/**/*.SKILL.md'
      - 'scripts/validate-skill.js'
      - 'scripts/skill-format.js'
      - 'package.json'
      - 'package-lock.json'
      - 'spec/SKILL_FORMAT.md'
      - 'spec/skill-security-patterns.json'
      - '.github/workflows/skill-lint.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**/*.SKILL.md'
      - 'scripts/validate-skill.js'
      - 'scripts/skill-format.js'
      - 'package.json'
      - 'package-lock.json'
      - 'spec/SKILL_FORMAT.md'
      - 'spec/skill-security-patterns.json'
      - '.github/workflows/skill-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    name: YAML Schema + Forbidden Pattern Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Validate complete skill catalogue
        run: find skills -name '*.SKILL.md' -print0 | sort -z | xargs -0 node scripts/validate-skill.js
