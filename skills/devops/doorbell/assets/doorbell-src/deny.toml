# Kaidera licence and supply-chain policy for Rust repos (kai@helix 2026-11-02).
# Rule (CTO, Cortex v2 B3): nothing AGPL, SSPL or BSL in what we ship. Anything not on the allow-list fails.
[graph]
all-features = true

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "Unlicense", "MPL-2.0", "BSL-1.0", "CDLA-Permissive-2.0",
]
# Note: "BSL-1.0" above is the Boost Software License (permissive), not the Business Source License (BUSL-1.1), which is not allowed.
confidence-threshold = 0.9

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
