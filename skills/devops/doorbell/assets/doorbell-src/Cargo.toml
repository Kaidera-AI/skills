[package]
name = "doorbell"
version = "0.1.0"
edition = "2024"
description = "Wakes idle AI Worker terminals (Orca) when a Cortex handoff is waiting. Carries no work: the job lives in the handoff."
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
humantime = "2"

[profile.release]
strip = true
lto = true
